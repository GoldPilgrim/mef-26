[package]
name = "mef-ffi"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Minimal stable C ABI metadata layer for MEF-26."
authors = ["GoldPilgrim"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/GoldPilgrim/mef-26"
publish = false

[lib]
name = "mef_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
mef-26 = { path = "../..", version = "0.1.1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
